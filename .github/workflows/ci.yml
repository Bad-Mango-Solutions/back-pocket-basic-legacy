name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - run: dotnet restore BackPocketBasicLegacy.slnx
    - run: dotnet build BackPocketBasicLegacy.slnx --configuration Release --no-restore
    - run: dotnet test BackPocketBasicLegacy.slnx --configuration Release --no-build --verbosity normal
